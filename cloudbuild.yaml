steps:
  - id: Build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --no-cache
      - -t
      - ${_IMAGE_REPOSITORY}/vpo-corp-platform:${COMMIT_SHA}
      - .
      - -f
      - Dockerfile

  - id: Push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_IMAGE_REPOSITORY}/vpo-corp-platform:${COMMIT_SHA}

  - id: Deploy API
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - services
      - update
      - ${_API_SERVICE}
      - --platform=managed
      - --image=${_IMAGE_REPOSITORY}/vpo-corp-platform:${COMMIT_SHA}
      - --labels=managed-by=cloud-build,commit-sha=${COMMIT_SHA}
      - --set-cloudsql-instances=${_CLOUDSQL_CONNECTION_NAME}
      - --update-env-vars=VPO_CLOUDSQL_CONNECTION_NAME=${_CLOUDSQL_CONNECTION_NAME},VPO_POSTGRES_APPLICATION_NAME=vpo-corp-api,VPO_POSTGRES_POOL_MIN_SIZE=1,VPO_POSTGRES_POOL_MAX_SIZE=4,VPO_POSTGRES_POOL_TIMEOUT_SECONDS=10,VPO_POSTGRES_POOL_MAX_WAITING=16,VPO_POSTGRES_POOL_MAX_LIFETIME_SECONDS=1800,VPO_POSTGRES_POOL_MAX_IDLE_SECONDS=300,VPO_ROYALTIES_DASHBOARD_BACKEND=bigquery,VPO_ROYALTIES_DASHBOARD_BIGQUERY_FALLBACK=1,VPO_BIGQUERY_PROJECT=vpo-corp-royalties,VPO_BIGQUERY_DATASET=royalties_analytics,VPO_BIGQUERY_LOCATION=US,VPO_BIGQUERY_MAX_BYTES_BILLED=2500000000
      - --max=2
      - --region=${_REGION}
      - --quiet

  - id: Deploy report Job
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - jobs
      - update
      - ${_REPORT_JOB}
      - --image=${_IMAGE_REPOSITORY}/vpo-corp-platform:${COMMIT_SHA}
      - --set-cloudsql-instances=${_CLOUDSQL_CONNECTION_NAME}
      - --update-env-vars=VPO_CLOUDSQL_CONNECTION_NAME=${_CLOUDSQL_CONNECTION_NAME},VPO_POSTGRES_APPLICATION_NAME=vpo-report-job,VPO_POSTGRES_POOL_MIN_SIZE=0,VPO_POSTGRES_POOL_MAX_SIZE=2,VPO_POSTGRES_POOL_TIMEOUT_SECONDS=10,VPO_POSTGRES_POOL_MAX_WAITING=4,VPO_POSTGRES_POOL_MAX_LIFETIME_SECONDS=1800,VPO_POSTGRES_POOL_MAX_IDLE_SECONDS=300
      - --region=${_REGION}
      - --quiet

  - id: Route API traffic
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - services
      - update-traffic
      - ${_API_SERVICE}
      - --to-latest
      - --region=${_REGION}
      - --quiet

  - id: Verify production alignment
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -ceu
      - |
        EXPECTED_IMAGE="${_IMAGE_REPOSITORY}/vpo-corp-platform:${COMMIT_SHA}"
        API_IMAGE="$(gcloud run services describe "${_API_SERVICE}" --region="${_REGION}" --format='value(spec.template.spec.containers[0].image)')"
        JOB_IMAGE="$(gcloud run jobs describe "${_REPORT_JOB}" --region="${_REGION}" --format='value(spec.template.spec.template.spec.containers[0].image)')"
        TRAFFIC="$(gcloud run services describe "${_API_SERVICE}" --region="${_REGION}" --format='value(status.traffic[0].percent)')"
        LATEST_REVISION="$(gcloud run services describe "${_API_SERVICE}" --region="${_REGION}" --format='value(status.latestReadyRevisionName)')"
        SERVING_REVISION="$(gcloud run services describe "${_API_SERVICE}" --region="${_REGION}" --format='value(status.traffic[0].revisionName)')"
        SERVING_COMMIT="$(gcloud run revisions describe "$${SERVING_REVISION}" --region="${_REGION}" --format='value(metadata.labels.commit-sha)')"
        SERVICE_URL="$(gcloud run services describe "${_API_SERVICE}" --region="${_REGION}" --format='value(status.url)')"

        test "$${API_IMAGE}" = "$${EXPECTED_IMAGE}"
        test "$${JOB_IMAGE}" = "$${EXPECTED_IMAGE}"
        test "$${TRAFFIC}" = "100"
        test "$${SERVING_REVISION}" = "$${LATEST_REVISION}"
        test "$${SERVING_COMMIT}" = "${COMMIT_SHA}"

        HEALTH_JSON="$(curl --fail --silent --show-error --retry 4 --retry-all-errors --retry-delay 10 --max-time 120 "$${SERVICE_URL}/health/ready")"
        printf '%s' "$${HEALTH_JSON}" | grep -q '"status":"ok"'
        printf '%s' "$${HEALTH_JSON}" | grep -q '"active_release_id":"'
        printf '%s' "$${HEALTH_JSON}" | grep -q '"using_stale_fallback":false'
        printf '%s' "$${HEALTH_JSON}" | grep -q '"last_error":null'
        printf '%s' "$${HEALTH_JSON}" | grep -q '"backend":"bigquery"'

images:
  - ${_IMAGE_REPOSITORY}/vpo-corp-platform:${COMMIT_SHA}

options:
  logging: CLOUD_LOGGING_ONLY
  substitutionOption: MUST_MATCH

substitutions:
  _API_SERVICE: vpo-corp-api
  _CLOUDSQL_CONNECTION_NAME: vpo-corp-royalties:us-central1:vpo-corp-postgres-ssd
  _IMAGE_REPOSITORY: us-central1-docker.pkg.dev/vpo-corp-royalties/cloud-run-source-deploy/royalties_pipeline
  _REGION: us-central1
  _REPORT_JOB: vpo-royalty-report-job

tags:
  - vpo-corp-platform
  - production
